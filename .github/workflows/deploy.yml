name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './client-app/package-lock.json'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        run: npm run build
        env:
          VITE_BASE_PATH: /prototype/vibe-prototype/

      - name: Verify Build
        run: ls -la dist

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./client-app/dist/
          server-dir: /vibe-prototype/
          timeout: 300000
