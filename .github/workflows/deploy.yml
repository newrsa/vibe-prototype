name: Deploy Client App to Shared Hosting

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client-app/package-lock.json

      # 3. Install dependencies only inside client-app/project
      - name: Install dependencies
        working-directory: ./client-app
        run: npm ci

      # 4. Build the React project
      - name: Build application
        working-directory: ./client-app
        run: npm run build

      # 5. Deploy only the build folder through FTP
      - name: Deploy to Shared Hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./client-app/dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}