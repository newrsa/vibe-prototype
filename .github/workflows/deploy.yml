name: Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './client-app/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          VITE_BASE_PATH: /prototype/vibe-prototype/

      - name: Verify Build
        run: ls -la dist

      - name: Deploy to FTP using LFTP
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          command -v lftp >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y lftp; }
          lftp -c "
            set ftp:ssl-allow yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode on;
            set net:max-retries 2;
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";
            mirror -R --verbose --ignore-time --parallel=10 ./dist/ /public_html/prototype/vibe-prototype/
          "
