name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './client-app/package-lock.json'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        run: npm run build
        env:
          VITE_BASE_PATH: /prototype/vibe-prototype/

      - name: Verify Build
        run: ls -la dist

      - name: Deploy to FTP using LFTP
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -d -c "set ftp:ssl-allow yes; set ssl:verify-certificate no; open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' ${{ secrets.FTP_SERVER }}; mirror -R ./dist/ public_html/prototype/vibe-prototype/ --ignore-time --parallel=10"
