name: Deploy Branches to FTP

on:
  push:
    branches:
      - main
      - app
      - nileshb

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout the branch that triggered the workflow
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Get branch name
      - name: Set Branch Name
        run: echo "BRANCH_NAME=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      # 3. Set deployment folder and Vite base path
      - name: Set Deploy Path
        run: |
          echo "DEPLOY_DIR=/${GITHUB_REF_NAME}/" >> $GITHUB_ENV
          echo "VITE_BASE_PATH=/${GITHUB_REF_NAME}/" >> $GITHUB_ENV

      # 4. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client-app/package-lock.json

      # 5. Install dependencies inside client-app
      - name: Install Dependencies
        working-directory: ./client-app
        run: npm ci

      # 6. Fetch Google Sheets Test Data
      - name: Fetch Test Data
        run: npm install googleapis dotenv && node read-tests.js
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          TESTING_SPREADSHEET_ID: ${{ secrets.TESTING_SPREADSHEET_ID }}

      # 7. Install Playwright Browsers
      - name: Install Playwright Browsers
        working-directory: ./client-app
        run: npx playwright install --with-deps

      # 8. Run UI Tests (Vibe Coding Runner)
      - name: Run UI Tests
        working-directory: ./client-app
        run: npx playwright test tests/vibe-runner.spec.ts

      # 9. Build React/Vite project
      - name: Build Project
        working-directory: ./client-app
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ env.VITE_BASE_PATH }}

      # 7. Verify build output
      - name: Verify Build
        run: ls -la ./client-app/dist

      # 8. Deploy to FTP
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./client-app/dist/
          server-dir: ./${{ env.BRANCH_NAME }}/